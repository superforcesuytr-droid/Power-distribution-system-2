name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (with PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pds_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Smoke test against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pds_test?sslmode=disable
        run: |
          go build -o pds ./cmd/pds
          ./pds --headless --port 18080 &
          sleep 3
          curl -fsS localhost:18080/api/status | grep -q '"state":"ready"'
          curl -fsS localhost:18080/api/boards/2 | grep -q '"util_pct":84'
          curl -fsS -X POST localhost:18080/api/circuits -H 'X-Role: technician' -H 'Content-Type: application/json' \
            -d '{"mcb_id":4,"name":"CI-Test","load_a":5}' | grep -q '"id"'
          kill %1

  windows-exe:
    name: Windows executable (cross-compiled)
    runs-on: ubuntu-latest
    needs: [test, windows-smoke]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi
      - run: build/build-windows.sh "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PowerDistributionSystem-windows-x64
          path: dist/PowerDistributionSystem.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PowerDistributionSystem.exe

  windows-smoke:
    name: Smoke test on real Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The exe is normally cross-compiled from a Mac or Linux, so this job is
      # the only place it is proved to actually run on Windows.
      - name: Build the exe
        run: go build -ldflags "-H windowsgui" -o PowerDistributionSystem.exe ./cmd/pds
      - name: Start it and check it serves the embedded UI
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\PowerDistributionSystem.exe `
            -ArgumentList '--headless','--port','18080' -PassThru
          try {
            $ok = $false
            foreach ($i in 1..20) {
              Start-Sleep -Seconds 1
              try {
                $status = Invoke-RestMethod http://127.0.0.1:18080/api/status
                $ok = $true; break
              } catch { }
            }
            if (-not $ok) { throw "the application did not start listening" }

            Write-Host "version:  $($status.version)"
            Write-Host "db state: $($status.db.state)"
            Write-Host "config:   $($status.config_path)"
            Write-Host "log:      $($status.log_path)"

            # With no database configured the app must come up and offer setup
            # rather than fail, and the Windows paths must resolve under AppData.
            if ($status.db.state -ne 'unconfigured') { throw "expected 'unconfigured', got '$($status.db.state)'" }
            if ($status.config_path -notlike '*AppData*') { throw "config path is not under AppData: $($status.config_path)" }

            $page = Invoke-WebRequest http://127.0.0.1:18080/
            if ($page.Content -notmatch 'Power Distribution System') { throw "the embedded UI was not served" }
            foreach ($asset in 'app.js','styles.css') {
              $r = Invoke-WebRequest "http://127.0.0.1:18080/$asset"
              if ($r.StatusCode -ne 200) { throw "$asset was not served" }
            }
            Write-Host "Windows smoke test passed"
          } finally {
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          }

  macos-app:
    name: macOS app bundle
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT";
          else echo "version=0.0.0-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi
      - run: build/build-macos.sh "${{ steps.ver.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PowerDistributionSystem-macos
          path: dist/PowerDistributionSystem-macos.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PowerDistributionSystem-macos.zip
